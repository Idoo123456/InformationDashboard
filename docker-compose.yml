version: '3.8'

services:
  # ==========================================
  # 1. DATABASE SERVICE (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: unri_dashboard_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: db_pusat_informasi
    ports:
      - "3307:3306" # Port 3307 di host agar tidak bertabrakan jika ada XAMPP lokal
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - unri_network

  # ==========================================
  # 2. BACKEND API SERVICE (Express / Node.js)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: unri_dashboard_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: db_pusat_informasi
      DB_PORT: 3306
      JWT_SECRET: unri_campus_dashboard_enterprise_secret_2026
    volumes:
      - ./server/uploads:/app/server/uploads
    networks:
      - unri_network

  # ==========================================
  # 3. FRONTEND & REVERSE PROXY (Nginx + React)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unri_dashboard_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"      # Akses langsung: http://localhost
      - "5173:80"    # Opsional: http://localhost:5173
    networks:
      - unri_network

volumes:
  mysql_data:
    driver: local

networks:
  unri_network:
    driver: bridge
